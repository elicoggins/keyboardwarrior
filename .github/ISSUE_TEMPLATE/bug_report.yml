name: Bug report
description: Something in the game is broken or behaves wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include your game version, platform, and steps to reproduce the bug.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the options screen (press **O** in-game).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Browser demo
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what the game did instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game
        2. ...
    validations:
      required: true

  - type: input
    id: song
    attributes:
      label: Song
      description: >
        Song name and chart source, if the bug only affects one song.
      placeholder: "Code Monkey (bundled)"

  - type: textarea
    id: crashlog
    attributes:
      label: Crash log
      description: >
        If the game crashed, paste `crash.log` from your settings folder —
        `~/Library/Application Support/keyboardwarrior/` on macOS,
        `~/.config/keyboardwarrior/` on Linux, `%APPDATA%\keyboardwarrior\` on
        Windows.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Attach screenshots or terminal output here.
