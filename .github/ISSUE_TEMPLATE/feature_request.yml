name: Feature request
description: Suggest something the game should do
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: Describe the feature as you'd want to use it.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: >
        What are you trying to do that's awkward or impossible today? The
        problem is usually more useful than a proposed solution — it leaves room
        for a better one.
    validations:
      required: true
